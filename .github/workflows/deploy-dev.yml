name: Deploy to Development VPS (1GB RAM)

on:
  push:
    branches:
      - dev
      - staging
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Dev VPS (Fork Mode)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Dependencies & Build Locally (Offload from 1GB VPS)
        run: |
          npm ci
          if [ -d "prisma" ]; then
            npx prisma generate
          fi
          npm run build

      - name: 4. Setup SSH Agent & Deploy Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_KEY }}

      - name: 5. Add VPS to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.DEV_SSH_PORT || 22 }} -H ${{ secrets.DEV_VPS_IP }} >> ~/.ssh/known_hosts

      - name: 6. Sync Artifacts to Dev VPS
        env:
          VPS_USER: ${{ secrets.DEV_VPS_USER || 'ubuntu' }}
          VPS_IP: ${{ secrets.DEV_VPS_IP }}
          PORT: ${{ secrets.DEV_SSH_PORT || 22 }}
          APP_NAME: ${{ github.event.repository.name }}
        run: |
          rsync -avz -e "ssh -p ${PORT}" --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude 'src' \
            --exclude 'test' \
            dist package.json package-lock.json $([ -d "prisma" ] && echo "prisma" || true) \
            "${VPS_USER}@${VPS_IP}:/var/www/april-eyewear-dev/${APP_NAME}/"

      - name: 7. Remote Post-Deploy (Prisma Migrate & PM2 Fork Reload)
        env:
          VPS_USER: ${{ secrets.DEV_VPS_USER || 'ubuntu' }}
          VPS_IP: ${{ secrets.DEV_VPS_IP }}
          PORT: ${{ secrets.DEV_SSH_PORT || 22 }}
          APP_NAME: ${{ github.event.repository.name }}
        run: |
          ssh -p ${PORT} "${VPS_USER}@${VPS_IP}" << 'EOF'
            set -e
            cd "/var/www/april-eyewear-dev/${{ env.APP_NAME }}"
            npm install --omit=dev --no-audit --no-fund
            if [ -d "prisma" ]; then
              npx prisma migrate deploy
            fi
            pm2 reload /var/www/april-eyewear-dev/ecosystem.dev.config.js --update-env || pm2 start /var/www/april-eyewear-dev/ecosystem.dev.config.js
            pm2 save
            echo "✅ Dev Deployment completed successfully!"
          EOF
