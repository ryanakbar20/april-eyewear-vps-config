# ==============================================================================
# APRIL EYEWEAR - DEVELOPMENT POSTGRESQL TUNING (1GB RAM)
# Tambahkan nilai ini ke: /etc/postgresql/16/main/postgresql.conf
# ==============================================================================

# Network & Connectivity
listen_addresses = '127.0.0.1'
port = 5432
max_connections = 25              # Sangat dibatasi agar RAM tidak habis

# Low-Memory Configuration (Hanya memakan ~160MB RAM)
shared_buffers = 128MB
effective_cache_size = 256MB
work_mem = 4MB
maintenance_work_mem = 32MB
wal_buffers = 4MB

# Checkpoint & WAL Rendah
min_wal_size = 100MB
max_wal_size = 500MB
checkpoint_completion_target = 0.7

# Query Planner
default_statistics_target = 50
random_page_cost = 1.1
effective_io_concurrency = 2
