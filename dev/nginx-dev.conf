# ==============================================================================
# APRIL EYEWEAR - DEVELOPMENT NGINX CONFIGURATION (1 Core / 1GB RAM)
# Domain: dev-api.aprileyewear.com (atau IP VPS)
# Letak file di VPS: /etc/nginx/sites-available/dev-api.aprileyewear.com
# ==============================================================================

server {
    server_name dev-api.aprileyewear.com 103.150.117.15;

    # Gzip Ringan (Hemat CPU 1 Core)
    gzip on;
    gzip_comp_level 4;
    gzip_types application/json text/plain text/css application/javascript;

    # 1. Dev Main Service (Port 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 2. Dev Shipment Service (Port 3002)
    location /api/v1/shipments/ {
        proxy_pass http://127.0.0.1:3002/shipments/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/dev-api.aprileyewear.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-api.aprileyewear.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = dev-api.aprileyewear.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name dev-api.aprileyewear.com 103.150.117.15;

    # Fallback jika diakses via IP langsung lewat port 80
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/shipments/ {
        proxy_pass http://127.0.0.1:3002/shipments/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
