# ==============================================================================
# APRIL EYEWEAR - PRODUCTION POSTGRESQL TUNING (4GB RAM)
# Tambahkan nilai ini ke: /etc/postgresql/16/main/postgresql.conf
# ==============================================================================

# Network & Connectivity
listen_addresses = '127.0.0.1'
port = 5432
max_connections = 60

# Memory Configuration
shared_buffers = 1024MB
effective_cache_size = 3072MB
work_mem = 16MB
maintenance_work_mem = 256MB
wal_buffers = 16MB

# Checkpoint & WAL
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# Query Planner Optimization (SSD/NVMe)
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200

# Logging
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 250 # Catat query lambat (> 250ms)
