# ==============================================================================
# APRIL EYEWEAR - PRODUCTION NGINX REVERSE PROXY & SECURITY GATEWAY
# Domain: api.aprileyewear.com
# Letak file di VPS: /etc/nginx/sites-available/api.aprileyewear.com
# ==============================================================================

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=prod_api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=prod_api_sensitive:10m rate=5r/s;

# Upstream ke PM2 Cluster Port
upstream main_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream shipment_backend {
    server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# Cloudflare real IP — $remote_addr menjadi IP klien sebenarnya, tapi HANYA bila koneksi berasal
# dari rentang IP Cloudflare. Header CF-Connecting-IP dari sumber lain (mis. klien langsung ke
# origin) diabaikan, sehingga IP tidak bisa dipalsukan untuk menembus rate limit / throttle.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Redirect HTTP ke HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.aprileyewear.com;
    return 301 https://$host$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.aprileyewear.com;

    # SSL Certificates (Cloudflare Origin Certificate / Let's Encrypt)
    ssl_certificate /etc/ssl/certs/aprileyewear_origin.pem;
    ssl_certificate_key /etc/ssl/private/aprileyewear_origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json text/plain text/css application/javascript application/xml;

    # Logging
    access_log /var/log/nginx/api_access.log;
    error_log /var/log/nginx/api_error.log warn;

    # 1. Main Service (E-Commerce, CMS, Catalog, Auth, Orders)
    location / {
        limit_req zone=prod_api_general burst=50 nodelay;

        proxy_pass http://main_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # real_ip Cloudflare membuat $remote_addr = IP klien asli; tulis ulang header apa pun
        # dari klien agar tidak bisa dipalsukan (guard backend hanya percaya nilai ini).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 2. Endpoint Sensitif (Checkout, Payment Callback, Biometric Session)
    location ~* ^/api/v1/(checkout|payments|kiosk/biometrics) {
        limit_req zone=prod_api_sensitive burst=10 nodelay;

        proxy_pass http://main_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # real_ip Cloudflare membuat $remote_addr = IP klien asli; tulis ulang header apa pun
        # dari klien agar tidak bisa dipalsukan (guard backend hanya percaya nilai ini).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Shipment Service (Biteship Integration, Tracking, Shipping Rates)
    #    Webhook Biteship WAJIB ke main-service: handler di sana melakukan two-way sync
    #    (order FULFILLED, timeline pesanan, push notification). Exact match menang atas prefix.
    location = /api/v1/shipments/webhook {
        limit_req zone=prod_api_general burst=30 nodelay;

        proxy_pass http://main_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # real_ip Cloudflare membuat $remote_addr = IP klien asli; tulis ulang header apa pun
        # dari klien agar tidak bisa dipalsukan (guard backend hanya percaya nilai ini).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/shipments/ {
        limit_req zone=prod_api_general burst=30 nodelay;

        # Rewrite /api/v1/shipments/* -> /shipments/* (service controller is @Controller('shipments')).
        # Tanpa rewrite ini, setiap request (rates/areas/track) akan 404 di produksi.
        proxy_pass http://shipment_backend/shipments/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # real_ip Cloudflare membuat $remote_addr = IP klien asli; tulis ulang header apa pun
        # dari klien agar tidak bisa dipalsukan (guard backend hanya percaya nilai ini).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
